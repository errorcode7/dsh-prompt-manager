</style>

<div id="tip"></div>

	<div class="hhead">对话历史<span class="spacer"></span><button class="bar-btn" id="btn-history-refresh" style="height:22px;font:inherit;cursor:pointer;border:1px solid #33384a;color:#e6e8ee;background:#232833;border-radius:11px;padding:0 8px;font-size:11px;">刷新</button></div>

<script>
"use strict";
// ── 常量 ──────────────────────────────────────────────────────────────────
const NODE_W = 236, NODE_H = 108, PAD = 26, COL_GAP = 88, V_GAP = 16, SIDE_ROW_GAP = 48;

function truncate(text, max) {
	if (!text) return "";
	return text.length > max ? text.slice(0, max) + "…" : text;
}

// ── RPC：直连 host 的专用 Connection 通道（同源、浏览器会话鉴权） ────────
const RPC_CHANNEL = "/prompt-manager-rpc";
async function callRpc(endpoint, payload) {
	const body = { type: "client-request", rpcId: crypto.randomUUID(), method: endpoint, payload: payload ?? {} };
	const res = await fetch(RPC_CHANNEL + "/" + endpoint, {
		method: "POST",
		headers: { "Content-Type": "application/json" },
		body: JSON.stringify(body)
	});
	const msg = await res.json();
	if (msg && msg.result && msg.result.ok === true) return msg.result.value;
	throw new Error(msg && msg.result && msg.result.error ? msg.result.error.message : "RPC failed");
}

// ── 布局：从左到右的分层布局（简化 Sugiyama：列分层 + 层内稳定顺序 + 列垂直居中 + 平滑贝塞尔）
//    主链列：来源 → 覆盖（仅激活预设时）→ 插值（仅存在实际 {{var}} 替换时）→ 最终；
//    连线按语义一一对应：同名段一条线、覆盖只连它作用的段，不做全连接。
//    侧翼（变量/上下文/工具）放底部一行。
// ─────────────────────────────────────────────────────────────────────────
// 自动收纳：以段名的「命名空间 tag」（冒号前部分，如 tool:read → tag "tool"）分组。
// 同一 tag 的段 ≥ MIN_GROUP 个时合并为一个收纳组节点（Android 桌面文件夹式，点击展开
// 面板逐条查看每个成员）；不足阈值或参与覆盖/插值链路的段保持独立节点。
// TAG_LABELS 只提供可选显示名覆盖（非分组规则）——新命名空间的段会自动收纳，无需改代码。
const MIN_GROUP = 3;
const TAG_LABELS = {
	tool: "工具说明段",
	plan: "计划模式段"
};

// ── hover 实体解释表（hash）：能解释的节点尽量解释，未收录的不显示 ──────
const ENTITY_EXPLANATIONS = {
	"src:harness:identity": "身份段（order -1000）：声明 agent 由 DeepSeek Harness 驱动，位于系统提示词最前（dsh-system-prompt 内置）。",
	"src:harness:source": "实现来源说明段：提示 agent 当前运行的 DSH 实现 checkout 位置与工作目录（启动注入）。",
	"src:app:web-surface": "Web 表面说明段：描述当前交互界面（Web GUI）与 checkout 的关系（dsh-web-app 注册）。",
	"src:deployment:persona-prefix": "persona 前缀段（order 0）：部署定义的 agent 人格与职责；可被 dsh-subagent 按 agent 覆盖。",
	"src:deployment:persona-suffix": "persona 后缀段（order 10200）：部署定义的人格补充说明，渲染在提示词末尾。",
	"src:plan:": "计划模式策略段（dsh-plan-mode 注册）：plan-mode 下约束 agent 只规划、不执行。",
	"src:tool:": "工具说明段（tool:*）：每个工具的提示词说明，教模型如何调用该工具（工具插件经 dsh-tools 注册）。",
	"src:ui:": "前端插件提示词段（dsh-client-ui-* 注册）。",
	"src:": "来源段：插件经 systemPrompt.section() 注册的提示词片段，按 order 升序渲染成系统提示词。",
	"ovr:": "预设覆盖操作：当前激活预设对该段的替换/插入/删除规则（来源 preset 文件）。",
	"int:": "变量插值段：该段 {{var}} 已被替换为实际值后的文本。",
	"sys": "系统提示词（渲染）：renderPrompt 输出——{{var}} 插值、空段丢弃、各段以空行连接。",
	"user": "用户输入：该轮用户消息（agent/pre-step 捕获 claimed），作为 user-role 消息发送。",
	"agg": "消息聚合：用户输入 + 动态上下文快照合并为 user-role 消息。",
	"req": "最终发送的请求：system 系统提示词 + messages 消息 + tools 工具 schema 的完整构成，随请求发送。",
	"side:vars": "变量：{{provider}}/{{model}}/{{cwd}} 等，在插值阶段替换进提示词文本。",
	"side:ctx": "动态上下文快照：系统生成的运行时状态说明（沙箱/审批策略等），作为 user-role 消息追加。",
	"side:ws": "工作区指令（AGENTS.md/CLAUDE.md）：dsh-agent-instructions 从工作区/项目根读取的指令文件内容，作为 user-role 消息注入（agent/pre-step）。",
	"side:skills": "技能目录（available_skills）：当前会话可用技能列表，说明经 skill 工具按需加载（dsh-tool-skill 注入）。",
	"side:tools": "工具 schema：工具定义（名称/描述/参数），随请求发送，供模型调用。"
};

/** 查节点解释：id 精确 → 最长前缀 → 无。 */
function explainFor(node) {
	if (!node) return undefined;
	if (ENTITY_EXPLANATIONS[node.id] !== undefined) return ENTITY_EXPLANATIONS[node.id];
	let best = null;
	for (const key of Object.keys(ENTITY_EXPLANATIONS)) {
		if (node.id.startsWith(key) && (best === null || key.length > best.length)) best = key;
	}
	return best !== null ? ENTITY_EXPLANATIONS[best] : undefined;
}

function computeLayout(pipeline, expandedGroups) {
	const nodes = [], edges = [];

	const mk = (id, kind, title, badges, preview, meta, body, name) => ({ id, kind, title, badges, preview, meta, body, name });

	// 来源阶段：按命名空间 tag 自动分组
	const groups = new Map();
	const singles = [];
	const coveredSet = new Set(pipeline.stages.override.map((o) => o.section));
	const hasVarsRef = (text) => /\{\{[a-z][a-z0-9_]*\}\}/.test(text);
	// order 徽章：真实 order（已知段，如 -1000/0）显示 "order -1000"；未知段的相对顺序占位显示 "#5"
	const orderBadge = (hint) => (hint <= 0 ? "order " + hint : "#" + hint);
	// 来源段生效状态徽章：host 已算好 status（active/empty/overridden/removed）
	const statusBadge = (s) => {
		if (s.status === "empty") return { text: "空段", cls: "st-empty" };
		if (s.status === "overridden") return { text: "被覆盖", cls: "st-overridden" };
		if (s.status === "removed") return { text: "被移除", cls: "st-removed" };
		return null; // active：正常生效，无需额外徽章
	};
	const singleNode = (s) => {
		const st = statusBadge(s);
		const badges = [orderBadge(s.orderHint), "来源"];
		if (st) badges.push(st.text);
		const n = mk("src:" + s.name, "source", s.name, badges, s.text === "" ? "(空)" : truncate(s.text, 90), s.source, s.text, s.name);
		if (st) n.statusCls = st.cls;
		n.sortOrder = s.orderHint;
		return n;
	};
	for (const s of pipeline.stages.source) {
		const tag = s.name.includes(":") ? s.name.slice(0, s.name.indexOf(":")) : null;
		const participates = coveredSet.has(s.name) || hasVarsRef(s.text); // 参与覆盖/插值链路的段保持独立
		if (tag === null || participates) {
			singles.push(singleNode(s));
			continue;
		}
		let g = groups.get(tag);
		if (g === undefined) {
			g = { tag, label: TAG_LABELS[tag] ?? tag + " 段", items: [] };
			groups.set(tag, g);
		}
		g.items.push(s);
	}
	const sourceItems = singles;
	const expandedSet = expandedGroups instanceof Set ? expandedGroups : new Set();
	for (const g of groups.values()) {
		if (g.items.length < MIN_GROUP) {
			for (const s of g.items) sourceItems.push(singleNode(s));
			continue;
		}
		// 折中方案：组被标记展开时，成员作为实体节点参与布局与连线（可再收起）
		if (expandedSet.has(g.tag)) {
			for (const s of g.items) sourceItems.push(singleNode(s));
			continue;
		}
		const names = g.items.map((s) => s.name).join(", ");
		const body = g.items.map((s) => "── " + s.name + " ──\n" + s.text).join("\n\n");
		const item = mk("src:" + g.tag + ":*", "source", g.label + "（" + g.items.length + "）", [g.tag + ": ×" + g.items.length, "收纳"], truncate(names, 90), "按命名空间 tag \"" + g.tag + "\" 自动收纳", body, g.tag + ":*");
		item.sortOrder = Math.min(...g.items.map((x) => x.orderHint)); // 组按成员最小 order 参与排序
		item.tag = g.tag;
		item.items = g.items.map((s) => ({ name: s.name, text: s.text }));
		sourceItems.push(item);
	}
	// 来源列严格按 order 升序排列（渲染顺序）：组节点按其成员最小 order 就位
	sourceItems.sort((a, b) => a.sortOrder - b.sortOrder);
	const overrideItems = pipeline.stages.override.length === 0
		? []
		: pipeline.stages.override.map((op, i) => mk("ovr:" + i, "override", op.action + " " + op.section, [op.action], "来自预设 " + op.presetName, op.presetFile, op.presetFile, op.section));
	// 插值列仅展示「实际发生 {{var}} 替换」的段：原始文本含 {{x}} 且插值后与原始不同。
	// 未变化的段不进入插值列（来源 → 最终直通），避免两列内容重复。
	const sourceByName = new Map(sourceItems.map((s) => [s.name, s]));
	const interpItems = [];
	for (const s of pipeline.stages.interpolated) {
		const original = sourceByName.get(s.name);
		if (original === undefined) continue;
		const changed = original.body !== s.text;
		const hasVars = /\{\{[a-z][a-z0-9_]*\}\}/.test(original.body); // 以原始文本判断是否含变量引用
		if (!changed || !hasVars) continue;
		// 列出实际替换对：{{model}}→deepseek-v4-flash
		const varNames = [...new Set((original.body.match(/\{\{[a-z][a-z0-9_]*\}\}/g) || []).map((m) => m.slice(2, -2)))];
		const replacements = varNames.slice(0, 3).map((v) => "{{" + v + "}}→" + (pipeline.variables[v] === undefined ? "未定义" : pipeline.variables[v])).join("  ");
		interpItems.push(mk("int:" + s.name, "interpolated", s.name + "（插值后）", [replacements], s.text === "" ? "(空)" : truncate(s.text, 90), "对 " + s.name + " 做变量替换后的文本", s.text, s.name));
	}
	// 终点双节点：系统提示词（渲染，中间结果）→ 最终发送的请求（system + messages + tools）
	const sysItem = mk("sys", "final", "系统提示词（渲染）", ["renderPrompt"], truncate(pipeline.rendered, 120), "renderPrompt 输出：{{var}} 已插值、空段丢弃、各段以空行连接", pipeline.rendered);
	const reqBody =
		"── system（系统提示词）──\n" + (pipeline.rendered || "(空)") + "\n\n" +
		"── messages（user-role 消息）──\n" +
		(pipeline.userInput && pipeline.userInput.trim() ? "[用户输入]\n" + pipeline.userInput + "\n\n" : "") +
		(pipeline.contextRendered ? "[动态上下文快照]\n" + pipeline.contextRendered + "\n\n" : "") +
		"（此前轮次的历史消息随请求一起发送，此处未展开）\n\n" +
		"── tools（工具 schema）──\n" +
		pipeline.tools.map((t) => t.name).join(", ");
	const reqItem = mk("req", "req", "最终发送的请求", ["system", "messages", "tools"], truncate(reqBody, 130), "完整模型请求构成：系统提示词 + 用户消息/上下文快照 + 工具 schema，随请求发送", reqBody);

	// 消息链实体：用户输入 → 消息聚合（user-role 消息）
	const hasUserInput = pipeline.userInput && pipeline.userInput.trim();
	const msgAggBody =
		"── 用户输入 ──\n" + (hasUserInput ? pipeline.userInput : "（本轮无用户消息）") + "\n\n" +
		"── 动态上下文快照 ──\n" + (pipeline.contextRendered || "（无）") + "\n\n" +
		"（聚合为 user-role 消息，与系统提示词、工具 schema 一同发送）";
	const msgAggItem = mk("agg", "msg", "消息聚合（user-role）", ["用户输入", "上下文快照"], truncate(msgAggBody, 120), "该轮用户输入与动态上下文快照聚合为 user-role 消息，随请求发送", msgAggBody);
	// 用户输入实体节点始终显示（无用户消息的轮次显示占位，保持消息链稳定）
	const userItem = mk("user", "msg", "用户输入", [hasUserInput ? "user-role" : "无用户消息"], truncate(hasUserInput ? pipeline.userInput : "（本轮无用户消息）", 90), hasUserInput ? "该轮用户输入（来自 agent/pre-step 的 claimed 消息）" : "本轮为 agent 内部步骤，claimed 无用户消息", hasUserInput ? pipeline.userInput : "（本轮无用户消息）");

	// 双链布局：第 1 行 = 系统链列（来源/覆盖/插值/系统渲染）；第 2 行 = 消息链（用户输入 → 消息聚合）；
	// 最右 = 最终发送的请求（垂直居中跨两行）
	const sysCol = [sysItem], reqCol = [reqItem];
	const sysColumns = [sourceItems];
	if (overrideItems.length > 0) sysColumns.push(overrideItems);
	if (interpItems.length > 0) sysColumns.push(interpItems);
	sysColumns.push(sysCol);

	// 顶部侧翼行（变量/上下文/工具）：有侧翼时主链列下移为其留出空间
	const hasSide = Object.keys(pipeline.variables).length > 0 || pipeline.contextRendered || (pipeline.tools && pipeline.tools.length > 0);
	const colTop = PAD + (hasSide ? NODE_H + SIDE_ROW_GAP : 0);

	const colW = NODE_W + COL_GAP;
	const colHeights = sysColumns.map((col) => col.length * (NODE_H + V_GAP) - V_GAP);
	const maxH = Math.max(...colHeights);
	const ROW_GAP = 36;
	// 第 1 行（顶部）：消息链（用户输入 → 消息聚合）——输入在顶部
	userItem.x = PAD; userItem.y = colTop; nodes.push(userItem);
	msgAggItem.x = PAD + colW; msgAggItem.y = colTop; nodes.push(msgAggItem);
	// 第 2 行：系统链列（来源/覆盖/插值/系统渲染）
	const row2Top = colTop + NODE_H + ROW_GAP;
	const sysColX = [];
	let x = PAD;
	for (let c = 0; c < sysColumns.length; c++) {
		sysColX.push(x);
		const col = sysColumns[c];
		const offset = (maxH - colHeights[c]) / 2;
		let y = row2Top + offset;
		for (const item of col) { item.x = x; item.y = y; nodes.push(item); y += NODE_H + V_GAP; }
		x += colW;
	}
	// 最右终点：最终发送的请求（垂直居中于消息链与系统链两行之间）
	reqItem.x = PAD + Math.max(sysColumns.length, 2) * colW;
	const chainBottom = row2Top + maxH;
	reqItem.y = colTop + (chainBottom - colTop - NODE_H) / 2;
	nodes.push(reqItem);

	let interpX = null;
	if (interpItems.length > 0) {
		const idx = 1 + (overrideItems.length > 0 ? 1 : 0); // source 之后（有覆盖则再后移一位）
		interpX = sysColX[idx];
	}
	const sysX = sysColX[sysColX.length - 1];

	// 语义连线：同名段一一对应；覆盖只连它作用的段；系统链汇聚到 sys，消息链汇聚到 agg，两者汇入 req
	const lastOf = (name) => {
		if (interpItems.length > 0) {
			const n = interpItems.find((i) => i.name === name);
			if (n) return n;
		}
		return sysItem;
	};
	const covered = new Set(overrideItems.map((o) => o.name));
	for (const op of overrideItems) {
		const src = sourceItems.find((s) => s.name === op.name);
		if (src) edges.push({ from: src, to: op, kind: "main" });
		edges.push({ from: op, to: lastOf(op.name), kind: "main" });
	}
	for (const s of sourceItems) {
		if (covered.has(s.name)) continue;
		edges.push({ from: s, to: lastOf(s.name), kind: "main" });
	}
	if (interpItems.length > 0) {
		for (const i of interpItems) edges.push({ from: i, to: sysItem, kind: "main" });
	}
	edges.push({ from: sysItem, to: reqItem, kind: "main" }); // 系统链 → 完整请求
	edges.push({ from: userItem, to: msgAggItem, kind: "main" }); // 消息链
	edges.push({ from: msgAggItem, to: reqItem, kind: "main" }); // 消息聚合 → 完整请求

	// 侧翼节点：顶部一行（变量→插值列上方；上下文→消息聚合；工具→最终请求）
	const sideY = PAD;
	let sideX = interpX !== null ? interpX : sysX;
	const sideAdd = (id, title, badges, preview, meta, body) => {
		const node = mk(id, "side", title, badges, preview, meta, body);
		node.x = sideX; node.y = sideY;
		nodes.push(node);
		sideX += NODE_W + 14;
		return node;
	};
	const interpAnchor = interpItems.length ? interpItems[0] : sysItem;
	if (Object.keys(pipeline.variables).length > 0) {
		const varsText = Object.entries(pipeline.variables).map(([k, v]) => "{{" + k + "}} = " + (v === undefined ? "未定义" : v)).join("\n");
		const node = sideAdd("side:vars", "变量", ["插值输入"], truncate(varsText, 80), "提供给变量插值阶段的 {{var}} 值", varsText);
		edges.push({ from: node, to: interpAnchor, kind: "dashed" });
	}
	if (pipeline.contextRendered) {
		const node = sideAdd("side:ctx", "动态上下文快照", ["user-role 消息"], truncate(pipeline.contextRendered, 80), "作为 user-role 消息并入消息聚合，随请求发送", pipeline.contextRendered);
		edges.push({ from: node, to: msgAggItem, kind: "dashed" });
	}
	if (pipeline.workspaceInstructions && pipeline.workspaceInstructions.trim()) {
		const files = (pipeline.workspaceFiles && pipeline.workspaceFiles.length) ? pipeline.workspaceFiles.join(" + ") : "AGENTS.md/CLAUDE.md";
		const node = sideAdd("side:ws", "工作区指令（" + files + "）", ["user-role 指令"], truncate(pipeline.workspaceInstructions, 90), "dsh-agent-instructions 从工作区/项目根读取的指令文件内容，作为 user-role 消息注入（agent/pre-step）", pipeline.workspaceInstructions);
		edges.push({ from: node, to: msgAggItem, kind: "dashed" });
	}
	if (pipeline.skillsCatalog && pipeline.skillsCatalog.trim()) {
		const node = sideAdd("side:skills", "技能目录", ["available_skills"], truncate(pipeline.skillsCatalog, 90), "当前会话可用技能列表，说明经 skill 工具按需加载（dsh-tool-skill 注入）", pipeline.skillsCatalog);
		edges.push({ from: node, to: msgAggItem, kind: "dashed" });
	}
	if (pipeline.tools && pipeline.tools.length) {
		const names = pipeline.tools.map((t) => t.name).join(", ");
		const node = sideAdd("side:tools", "工具 schema（" + pipeline.tools.length + "）", ["随请求发送"], truncate(names, 80), "工具定义（name/description/参数），由 @deepseek-ai/dsh-tools 汇总各工具插件注册，随请求发送；点击展开查看每个工具的 schema", names);
		node.items = pipeline.tools.map((t) => ({ name: t.name, text: t.description || "(无描述)" }));
		edges.push({ from: node, to: reqItem, kind: "dashed" });
	}

	const worldW = nodes.reduce((m, n) => Math.max(m, n.x + NODE_W), 0) + PAD;
	const worldH = nodes.reduce((m, n) => Math.max(m, n.y + NODE_H), 0) + PAD;
	// 相对顺序占位（#N）的段数：真实 order 未知（注册表组装后不暴露），布局仍按组装顺序排列
	const orderHintCount = pipeline.stages.source.filter((s) => s.orderHint > 0).length;
	return { nodes, edges, worldW, worldH, orderHintCount };
}

// ── 绘制连线（水平贝塞尔） ───────────────────────────────────────────────
function draw(canvas, layout, scale, hoverId) {
	const dpr = window.devicePixelRatio || 1;
	canvas.width = Math.max(1, Math.round(layout.worldW * dpr * scale));
	canvas.height = Math.max(1, Math.round(layout.worldH * dpr * scale));
	const ctx = canvas.getContext("2d");
	ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);
	ctx.clearRect(0, 0, layout.worldW, layout.worldH);
	// 点阵背景
	ctx.fillStyle = "rgba(128,128,128,0.22)";
	for (let gx = 24; gx < layout.worldW; gx += 24) {
		for (let gy = 24; gy < layout.worldH; gy += 24) { ctx.beginPath(); ctx.arc(gx, gy, 1, 0, Math.PI * 2); ctx.fill(); }
	}
	for (const e of layout.edges) {
		const hovered = hoverId !== null && (e.from.id === hoverId || e.to.id === hoverId);
		ctx.strokeStyle = hovered ? "rgba(59,130,246,0.95)" : (e.kind === "dashed" ? "rgba(140,140,150,0.55)" : "rgba(120,130,160,0.75)");
		ctx.lineWidth = hovered ? 2.2 : 1.4;
		ctx.setLineDash(e.kind === "dashed" ? [5, 4] : []);
		ctx.beginPath();
		const x1 = e.from.x + NODE_W, y1 = e.from.y + NODE_H / 2; // 源右缘中点
		const x2 = e.to.x, y2 = e.to.y + NODE_H / 2; // 目标左缘中点
		ctx.moveTo(x1, y1);
		const dx = Math.max(28, (x2 - x1) / 2);
		ctx.bezierCurveTo(x1 + dx, y1, x2 - dx, y2, x2, y2);
		ctx.stroke();
		ctx.setLineDash([]);
		// 箭头
		const angle = Math.atan2(y2 - y1, x2 - x1);
		ctx.fillStyle = hovered ? "rgba(59,130,246,0.95)" : "rgba(120,130,160,0.75)";
		ctx.beginPath();
		ctx.moveTo(x2, y2);
		ctx.lineTo(x2 - 8 * Math.cos(angle - 0.42), y2 - 8 * Math.sin(angle - 0.42));
		ctx.lineTo(x2 - 8 * Math.cos(angle + 0.42), y2 - 8 * Math.sin(angle + 0.42));
		ctx.closePath();
		ctx.fill();
	}
}

// ── 状态与渲染 ───────────────────────────────────────────────────────────
let layout = null, scale = 1, hoverId = null, pipeline = null;
let roundIndex = 0, roundCount = 0;
let expandedGroups = new Set(); // 画布内展开的收纳组 tag（折中方案：成员作为实体节点）
const wrap = document.getElementById("wrap");
const stage = document.getElementById("stage");
const world = document.getElementById("world");
const cv = document.getElementById("cv");
const statusEl = document.getElementById("status");
const modal = document.getElementById("modal");
const panel = document.getElementById("panel");

function escapeHtml(s) { return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

function renderNodes() {
	world.innerHTML = "";
	world.appendChild(cv);
	const groupNodes = [];
	for (const node of layout.nodes) {
		const el = document.createElement("div");
		el.className = "node " + node.kind;
		el.style.left = node.x + "px";
		el.style.top = node.y + "px";
		el.innerHTML =
			'<div class="head"><span class="t"></span>' + node.badges.map((b, bi) => '<span class="badge' + (bi === node.badges.length - 1 && node.statusCls ? " " + node.statusCls : "") + '">' + escapeHtml(b) + "</span>").join("") + "</div>" +
			'<p class="meta">' + (node.meta ? escapeHtml(node.meta) : " ") + "</p>" +
			'<p class="body"></p>';
		el.querySelector(".t").textContent = node.title;
		el.querySelector(".body").textContent = node.preview;
		el.dataset.id = node.id;
		el.addEventListener("click", () => node.items ? openGroup(node) : openDetail(node));
		el.addEventListener("mouseover", (ev) => { hoverId = node.id; refreshHover(); showTip(node, ev); });
		el.addEventListener("mouseout", () => { hoverId = null; refreshHover(); hideTip(); });
		if (node.items !== undefined && node.tag !== undefined) groupNodes.push(node);
		world.appendChild(el);
	}
	// 收纳组 ⭕+ 作为 world 独立按钮（组节点 overflow:hidden 会裁剪矩形外的控件）
	for (const node of groupNodes) {
		const plus = document.createElement("button");
		plus.className = "collapse-plus";
		plus.textContent = "+";
		plus.title = "在画布中展开该收纳组（" + node.items.length + " 个成员）";
		plus.style.cssText =
			"position:absolute;left:" + (node.x - 26) + "px;top:" + (node.y + NODE_H / 2 - 11) + "px;" +
			"width:22px;height:22px;border-radius:50%;cursor:pointer;z-index:31;" +
			"border:1px solid #3b82f6;background:#16233a;color:#8ab4f8;font-size:13px;line-height:1;padding:0;";
		plus.addEventListener("click", (ev) => {
			ev.stopPropagation();
			expandedGroups.add(node.tag);
			rerenderCanvas();
		});
		world.appendChild(plus);
	}
	world.style.width = layout.worldW + "px";
	world.style.height = layout.worldH + "px";
	cv.style.width = layout.worldW + "px";
	cv.style.height = layout.worldH + "px";
	applyTransform();
}

function refreshHover() {
	draw(cv, layout, scale, hoverId);
	for (const el of world.children) {
		if (el === cv) continue;
		el.classList.toggle("hover", el.dataset.id === hoverId);
	}
}

// ── hover 实体解释 tooltip ───────────────────────────────────────────────
const tipEl = document.getElementById("tip");
let tipVisible = false;

function showTip(node, ev) {
	const text = explainFor(node);
	if (text === undefined) { hideTip(); return; }
	let extra = "";
	if (node.statusCls === "st-empty") extra = "\n\n状态：空段——text 为空，渲染时被丢弃，不进入最终系统提示词。";
	else if (node.statusCls === "st-overridden") extra = "\n\n状态：被覆盖——激活预设对该段执行 replace，渲染用覆盖段替换原段。";
	else if (node.statusCls === "st-removed") extra = "\n\n状态：被移除——激活预设对该段执行 remove，不进入渲染。";
	tipEl.innerHTML = '<div class="tip-title">' + escapeHtml(node.title) + "</div>" + escapeHtml(text + extra);
	tipEl.style.display = "block";
	tipVisible = true;
	positionTip(ev);
}

function hideTip() {
	tipVisible = false;
	tipEl.style.display = "none";
}

function positionTip(ev) {
	if (!tipVisible) return;
	const pad = 14;
	let x = ev.clientX + pad;
	let y = ev.clientY + pad;
	const rect = tipEl.getBoundingClientRect();
	if (x + rect.width > window.innerWidth - 8) x = ev.clientX - rect.width - pad;
	if (y + rect.height > window.innerHeight - 8) y = ev.clientY - rect.height - pad;
	tipEl.style.left = x + "px";
	tipEl.style.top = y + "px";
}

window.addEventListener("mousemove", (ev) => {
	if (tipVisible) positionTip(ev);
});

function applyTransform() {
	world.style.transform = "scale(" + scale + ")";
	// 舞台尺寸随 world×scale 增长（最小撑满视口）；world 手动居中：
	// 视觉中心 = left + W*s/2，令其等于舞台中心 S/2 → left = (S - W*s)/2
	const S = Math.max(layout.worldW * scale, wrap.clientWidth);
	const T = Math.max(layout.worldH * scale, wrap.clientHeight);
	stage.style.width = S + "px";
	stage.style.height = T + "px";
	world.style.left = (S - layout.worldW * scale) / 2 + "px";
	world.style.top = (T - layout.worldH * scale) / 2 + "px";
	draw(cv, layout, scale, hoverId);
	statusEl.textContent = Math.round(scale * 100) + "%";
}

/** 缩放并保持内容中心在视口中心（居中展示）。 */
function zoomAtCenter(next) {
	scale = Math.max(0.3, Math.min(2.5, next));
	applyTransform();
	const sw = Math.max(layout.worldW * scale, wrap.clientWidth);
	const sh = Math.max(layout.worldH * scale, wrap.clientHeight);
	wrap.scrollLeft = Math.max(0, (sw - wrap.clientWidth) / 2);
	wrap.scrollTop = Math.max(0, (sh - wrap.clientHeight) / 2);
}

function fit() {
	if (!layout) return;
	const vw = wrap.clientWidth, vh = wrap.clientHeight;
	const s = Math.min(vw / layout.worldW, vh / layout.worldH, 1.2);
	zoomAtCenter(Math.max(0.3, Math.round(s * 100) / 100));
}

// ── 对话历史侧栏：状态与渲染 ─────────────────────────────────────────────
let historySessions = [];
let selectedSessionId = null; // 当前展示的 session（null = 全局轮次导航）
let selectedRound = 0;        // 当前轮（0 = 最新）

async function load(sel) {
	// sel: { sessionId, round } | { index } | undefined(重载当前)
	statusEl.textContent = "加载中…";
	if (sel === undefined) sel = selectedSessionId !== null ? { sessionId: selectedSessionId, round: selectedRound } : { index: roundIndex };
	if (sel.sessionId !== undefined) {
		selectedSessionId = sel.sessionId;
		selectedRound = Number.isFinite(sel.round) ? sel.round : 0;
	} else {
		selectedSessionId = null;
		roundIndex = Number.isFinite(sel.index) ? sel.index : 0;
	}
	try {
		pipeline = await callRpc("getPipeline", sel);
		expandedGroups = new Set(); // 切换轮次/加载时重置展开状态
		layout = computeLayout(pipeline, expandedGroups);
		renderNodes();
		fit();
		const hc = (pipeline.history || {}).count || 0;
		const hi = (pipeline.history || {}).index || 0;
		roundCount = hc; roundIndex = hi;
		const t = new Date(pipeline.ts).toLocaleTimeString();
		const who = selectedSessionId !== null ? (pipeline.title ? "会话 " + pipeline.title : "会话 " + String(selectedSessionId).slice(0, 8)) + " · " + (pipeline.cwd || "") : "全局最近轮次";
		statusEl.textContent = (pipeline.scope === "agent" ? "真实模型步骤" : "全局快照") + " · " + layout.nodes.length + " 个节点 · " + t + " · " + who + " · 当前预设：" + (pipeline.active || "（无）");
		updateRoundLabel();
		renderHistoryPanel();
		updateExpandButton();
		renderCollapseFloat();
	} catch (e) {
		statusEl.textContent = "加载失败：" + (e && e.message ? e.message : e);
	}
}

/** 展开/收起状态变化后重算布局并渲染（保持当前轮次）。 */
function rerenderCanvas() {
	if (layout === null || pipeline === null) return;
	layout = computeLayout(pipeline, expandedGroups);
	renderNodes();
	renderCollapseFloat();
	fit();
	updateExpandButton();
	statusEl.textContent = (pipeline.scope === "agent" ? "真实模型步骤" : "全局快照") + " · " + layout.nodes.length + " 个节点 · 当前预设：" + (pipeline.active || "（无）");
}

/** 顶部「收起展开段」按钮可见性（有展开的组时显示）。 */
function updateExpandButton() {
	const btn = document.getElementById("btn-collapse-groups");
	if (btn) btn.style.display = expandedGroups.size > 0 ? "" : "none";
}

/** 展开成员的收起控件：每个成员实体节点右侧中轴 ⭕−，点击收起该组。 */
function renderCollapseFloat() {
	document.querySelectorAll(".collapse-minus").forEach((el) => el.remove());
	if (expandedGroups.size === 0 || layout === null) return;
	for (const tag of expandedGroups) {
		const members = layout.nodes.filter((n) => n.kind === "source" && n.id.startsWith("src:" + tag + ":"));
		for (const m of members) {
			const el = document.createElement("button");
			el.className = "collapse-minus";
			el.textContent = "−";
			el.title = "收起画布中展开的收纳组（" + tag + "）";
			el.style.cssText =
				"position:absolute;left:" + (m.x + NODE_W + 4) + "px;" +
				"top:" + (m.y + NODE_H / 2 - 11) + "px;" +
				"width:22px;height:22px;border-radius:50%;cursor:pointer;z-index:31;" +
				"border:1px solid #3b82f6;background:#16233a;color:#8ab4f8;font-size:15px;line-height:1;padding:0;";
			el.addEventListener("click", () => {
				expandedGroups.delete(tag);
				rerenderCanvas();
			});
			world.appendChild(el);
		}
	}
}

function updateRoundLabel() {
	const el = document.getElementById("round-label");
	if (roundCount === 0) { el.textContent = "轮次 -"; return; }
	el.textContent = "轮次 " + (roundCount - roundIndex) + "/" + roundCount;
	document.getElementById("btn-prev").disabled = roundIndex >= roundCount - 1;
	document.getElementById("btn-next").disabled = roundIndex <= 0;
	document.getElementById("btn-latest").disabled = roundIndex === 0;
}

/** 拉取并渲染对话历史（按 session 分类）。 */
async function refreshHistory() {
	try {
		const data = await callRpc("getHistory", {});
		historySessions = data.sessions || [];
		renderHistoryPanel();
		// 跟随模式：当前选中的 session 有新轮次且在看最新轮 → 自动切到最新
		if (selectedSessionId !== null && selectedRound === 0) {
			const mine = historySessions.find((s) => s.sessionId === selectedSessionId);
			if (mine !== undefined && mine.roundCount > roundCount) void load({ sessionId: selectedSessionId, round: 0 });
		}
		return historySessions;
	} catch (e) {
		return null;
	}
}

function renderHistoryPanel() {
	const body = document.getElementById("history-body");
	if (!historySessions || historySessions.length === 0) {
		body.innerHTML = '<div class="empty">暂无历史（本次运行尚无真实组装）</div>';
		return;
	}
	body.innerHTML = "";
	for (const s of historySessions) {
		const box = document.createElement("div");
		box.className = "sess" + (s.sessionId === selectedSessionId ? " active" : "");
		const row = document.createElement("div");
		row.className = "srow";
		const name = document.createElement("span");
		name.className = "sname";
		name.textContent = s.title || String(s.sessionId).slice(0, 12);
		name.title = s.sessionId;
		const count = document.createElement("span");
		count.className = "scount";
		count.textContent = s.roundCount + " 轮";
		row.appendChild(name); row.appendChild(count);
		box.appendChild(row);
		const cwd = document.createElement("div");
		cwd.className = "scwd";
		cwd.textContent = s.cwd || "(无工作区)";
		box.appendChild(cwd);
		// 选中时展开轮次列表
		if (s.sessionId === selectedSessionId) {
			const rounds = document.createElement("div");
			rounds.className = "rounds";
			const tsList = s.roundsTs || [];
			// 最新在最上方：第 k 行 = round index (k-1)，0 = 该 session 最新轮
			for (let k = 1; k <= s.roundCount; k++) {
				const r = k - 1;
				const rEl = document.createElement("div");
				rEl.className = "round" + (r === selectedRound ? " current" : "");
				const ts = tsList[s.roundCount - k];
				const rt = ts !== undefined ? new Date(ts).toLocaleTimeString() : ("#" + k);
				rEl.textContent = k + ". " + rt + (r === 0 ? "（最新）" : "");
				// 每轮用户输入预览（有用户消息的轮次）
				const uiList = s.roundsUserInputs || [];
				const ui = uiList[s.roundCount - k];
				if (ui && ui.trim()) {
					const uiEl = document.createElement("div");
					uiEl.style.cssText = "font-size:11px;color:#8b90a0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:230px;margin-left:22px;";
					uiEl.textContent = "✎ " + ui.trim().slice(0, 40);
					uiEl.title = ui.trim();
					rEl.appendChild(uiEl);
				}
				rEl.addEventListener("click", (ev) => { ev.stopPropagation(); void load({ sessionId: s.sessionId, round: r }); });
				rounds.appendChild(rEl);
			}
			box.appendChild(rounds);
		}
		box.addEventListener("click", () => { void load({ sessionId: s.sessionId, round: 0 }); });
		body.appendChild(box);
	}
}

// ── 左侧预设控制面板（管理视图：全部预设 + 开关状态）──────────────────────
let presetsData = null;        // listPresets 结果
let presetsBody = document.getElementById("presets-body");
let presetsBusy = false;

async function loadPresets() {
	if (presetsBusy) return;
	presetsBusy = true;
	presetsBody.innerHTML = '<div class="pempty">加载中…</div>';
	try {
		presetsData = await callRpc("listPresets", {});
		renderPresetPanel();
	} catch (e) {
		presetsBody.innerHTML = '<div class="pempty">加载失败：' + escapeHtml((e && e.message) ? e.message : e) + "</div>";
	} finally {
		presetsBusy = false;
	}
}

function renderPresetPanel() {
	if (presetsData === null) return;
	const list = presetsData.presets || [];
	if (list.length === 0) {
		presetsBody.innerHTML = '<div class="pempty">暂无预设。可在设置页新建，或用 save_prompt 工具固化。</div>';
		return;
	}
	const rows = [];
	for (const p of list) {
		const active = p.name === presetsData.active;
		const row = document.createElement("div");
		row.className = "prow" + (active ? " active" : "");
		const line = document.createElement("div");
		line.className = "pline";
		const name = document.createElement("span");
		name.className = "pname";
		name.textContent = p.name;
		name.title = p.path || p.name;
		line.appendChild(name);
		const kind = document.createElement("span");
		kind.className = "pkind " + p.kind;
		kind.textContent = p.kind === "builtin" ? "内置" : "个性";
		line.appendChild(kind);
		const state = document.createElement("span");
		state.className = "pstate " + (active ? "on" : "off");
		state.textContent = active ? "生效" : "未启用";
		line.appendChild(state);
		const sw = document.createElement("button");
		sw.className = "switch" + (active ? " on" : "");
		sw.setAttribute("role", "switch");
		sw.setAttribute("aria-checked", active ? "true" : "false");
		sw.title = active ? "停用此预设" : "启用此预设（下一模型步骤生效）";
		sw.appendChild(Object.assign(document.createElement("span"), { className: "knob" }));
		sw.addEventListener("click", () => void togglePreset(p.name, active));
		line.appendChild(sw);
		row.appendChild(line);
		if (p.label && p.label !== p.name) {
			const label = document.createElement("div");
			label.className = "plabel";
			label.textContent = p.label + " · " + p.ruleCount + " 条规则";
			row.appendChild(label);
		} else {
			const label = document.createElement("div");
			label.className = "plabel";
			label.textContent = p.ruleCount + " 条规则";
			row.appendChild(label);
		}
		if (p.description) {
			const desc = document.createElement("div");
			desc.className = "pdesc";
			desc.textContent = p.description;
			row.appendChild(desc);
		}
		rows.push(row);
	}
	presetsBody.innerHTML = "";
	for (const r of rows) presetsBody.appendChild(r);
}

async function togglePreset(name, active) {
	try {
		await callRpc("setActive", { name: active ? "" : name });
		await loadPresets();
		await load(); // 重载当前轮次：主图覆盖列/来源段状态标记随激活变化
	} catch (e) {
		presetsBody.innerHTML = '<div class="pempty">切换失败：' + escapeHtml((e && e.message) ? e.message : e) + "</div>";
	}
}

wrap.addEventListener("wheel", (e) => {
	e.preventDefault();
	const factor = e.deltaY < 0 ? 1.1 : 1 / 1.1;
	const next = scale * factor;
	if (next === scale) return;
	zoomAtCenter(next);
}, { passive: false });

let dragging = false, sx = 0, sy = 0, sl = 0, st = 0;
wrap.addEventListener("mousedown", (e) => {
	if (e.target.closest(".node") || e.target === cv) return;
	dragging = true;
	wrap.classList.add("dragging");
	sx = e.clientX; sy = e.clientY; sl = wrap.scrollLeft; st = wrap.scrollTop;
	e.preventDefault();
});
window.addEventListener("mousemove", (e) => {
	if (!dragging) return;
	wrap.scrollLeft = sl - (e.clientX - sx);
	wrap.scrollTop = st - (e.clientY - sy);
});
window.addEventListener("mouseup", () => { dragging = false; wrap.classList.remove("dragging"); });

modal.addEventListener("click", (e) => { if (e.target === modal) modal.style.display = "none"; });

// ── 草稿预览浮层：?draft=<overrides JSON> —— 预测落位 + 拖拽排序 + 保存 ──
const draftPanel = document.getElementById("draft-panel");
const draftBody = document.getElementById("draft-body");
const draftParam = new URLSearchParams(location.search).get("draft");
const draftPresetParam = new URLSearchParams(location.search).get("preset"); // 来自编辑器的预设名（可选）
const DRAFT_TOP_ORDER = -2000; // 与 host normalizePreset 的置顶哨兵一致
let draftOverrides = null;     // 当前草稿规则（可变，拖拽/保存都改它）
let draftPreviewData = null;   // 最近一次预览响应（含每段精确排序 key）

async function loadDraftPreview() {
	if (draftParam === null) return;
	draftPanel.classList.add("open");
	try {
		draftOverrides = JSON.parse(draftParam);
	} catch (e) {
		draftBody.innerHTML = '<div class="empty">草稿参数解析失败：' + escapeHtml(String(e && e.message ? e.message : e)) + "</div>";
		return;
	}
	await refreshDraftPreview();
}

async function refreshDraftPreview() {
	draftBody.innerHTML = '<div class="empty">计算草稿落位中…</div>';
	try {
		const data = await callRpc("previewPreset", { overrides: draftOverrides });
		draftPreviewData = data;
		renderDraftPreview(data);
	} catch (e) {
		draftBody.innerHTML = '<div class="empty">加载失败：' + escapeHtml((e && e.message) ? e.message : e) + "</div>";
	}
}

/** 拖到槽位 slot（applied[slot] 之前）：取邻居真实 key 算中点 order，写回草稿并重算。 */
function handleDraftDrop(e, slot) {
	e.preventDefault();
	if (!draftPreviewData) return;
	const name = e.dataTransfer ? String(e.dataTransfer.getData("text/plain") || "") : "";
	const applied = draftPreviewData.applied || [];
	if (!name || applied.length === 0) return;
	const prev = slot > 0 ? applied[slot - 1] : null;
	const next = slot < applied.length ? applied[slot] : null;
	const keyOf = (s) => (typeof s.key === "number" ? s.key : s.position - 1);
	let order;
	if (prev === null) order = DRAFT_TOP_ORDER;            // 拖到最前 = 置顶
	else if (next === null) order = keyOf(prev) + 1;       // 拖到最后
	else order = (keyOf(prev) + keyOf(next)) / 2;          // 中点：精确落在两者之间
	const rule = draftOverrides.find((r) => r.section === name);
	if (!rule) return;
	rule.order = order;
	delete rule.after;
	delete rule.top;
	document.getElementById("draft-save-status").textContent = "";
	void refreshDraftPreview();
}

function renderDraftPreview(data) {
	if (!data || data.error) {
		draftBody.innerHTML = '<div class="empty">' + escapeHtml(data ? data.error : "无数据") + "</div>";
		return;
	}
	const applied = data.applied || [];
	draftBody.innerHTML = "";
	if (applied.length === 0) {
		draftBody.innerHTML = '<div class="empty">（无渲染段）</div>';
		return;
	}
	for (const s of applied) {
		const row = document.createElement("div");
		row.className = "drow" + (s.draft ? " draft" : "");
		row.setAttribute("draggable", s.draft ? "true" : "false");
		if (s.draft) row.title = "拖动调整渲染顺序";
		row.addEventListener("dragstart", (ev) => { ev.dataTransfer.setData("text/plain", s.name); ev.dataTransfer.effectAllowed = "move"; });
		row.addEventListener("dragover", (ev) => { ev.preventDefault(); });
		row.addEventListener("drop", (ev) => handleDraftDrop(ev, applied.indexOf(s)));
		const pos = document.createElement("span");
		pos.className = "dpos";
		pos.textContent = "#" + s.position;
		const name = document.createElement("span");
		name.className = "dname";
		name.textContent = s.name;
		name.title = s.name;
		row.appendChild(pos);
		row.appendChild(name);
		if (s.draft) {
			const tag = document.createElement("span");
			tag.className = "dtag";
			tag.textContent = "自定义 · 可拖动";
			row.appendChild(tag);
			// 空文本段：列表显示但渲染时被丢弃——明示
			const rule = (draftOverrides || []).find((r) => r.section === s.name);
			if (!rule || String(rule.text || "").trim() === "") {
				const emptyTag = document.createElement("span");
				emptyTag.style.cssText = "font-size:10px;border-radius:999px;padding:0 6px;line-height:16px;white-space:nowrap;color:#ef6a6a;border:1px solid #6b2f36;";
				emptyTag.textContent = "空文本 · 不会渲染";
				row.appendChild(emptyTag);
			}
		}
		draftBody.appendChild(row);
	}
	// 尾部追加区（拖到最末尾）
	const tail = document.createElement("div");
	tail.style.cssText = "height:14px;border-radius:6px;";
	tail.addEventListener("dragover", (ev) => ev.preventDefault());
	tail.addEventListener("drop", (ev) => handleDraftDrop(ev, applied.length));
	draftBody.appendChild(tail);
	// 默认保存目标：编辑器带来的预设名优先，其次当前激活预设（只在未手动输入时填充）
	const nameInput = document.getElementById("draft-save-name");
	if (nameInput && nameInput.value === "") {
		nameInput.value = draftPresetParam || (presetsData && presetsData.active ? presetsData.active : "");
		nameInput.placeholder = draftPresetParam ? "保存到：" + draftPresetParam : "目标预设名（默认当前激活）";
	}
}

document.getElementById("btn-draft-close").addEventListener("click", () => { location.search = ""; });

document.getElementById("btn-draft-save").addEventListener("click", async () => {
	const statusEl = document.getElementById("draft-save-status");
	const name = document.getElementById("draft-save-name").value.trim();
	if (!name) { statusEl.textContent = "请输入目标预设名"; statusEl.className = "dstatus err"; return; }
	if (!draftOverrides || draftOverrides.length === 0) { statusEl.textContent = "草稿为空，无需保存"; statusEl.className = "dstatus err"; return; }
	const exists = presetsData && presetsData.presets.some((p) => p.name === name);
	statusEl.textContent = "保存中…";
	statusEl.className = "dstatus";
	try {
		if (exists) await callRpc("updatePreset", { name, overrides: draftOverrides });
		else await callRpc("createPreset", { name, overrides: draftOverrides });
		statusEl.textContent = "已保存 ✓（下一次模型步骤生效）";
		statusEl.className = "dstatus ok";
		void loadPresets();
	} catch (e) {
		statusEl.textContent = "保存失败：" + ((e && e.message) ? e.message : e);
		statusEl.className = "dstatus err";
	}
});

// 启动：默认展示最新 session 的最新一轮；无历史时回退全局最新
(async () => {
	void loadPresets(); // 左侧预设面板与主图并行加载
	void loadDraftPreview(); // 草稿预览浮层（无 ?draft= 时为空操作）
	try {
		const data = await callRpc("getHistory", {});
		historySessions = data.sessions || [];
	} catch (e) { historySessions = []; }
	if (historySessions.length > 0) {
		await load({ sessionId: historySessions[0].sessionId, round: 0 });
	} else {
		await load({ index: 0 });
	}
	// 轮询对话历史（3s）：右侧列表动态更新 + 跟随最新轮
	setInterval(() => { void refreshHistory(); }, 3000);
})();
</script>
</body>
